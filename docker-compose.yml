name: multi-store-commerce
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development password in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_SOURCE:-./.dockerized-postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [commerce, db_access]
  backend:
    build:
      context: ./backend
      args:
        MAVEN_CACHE_ID: ${MAVEN_CACHE_ID:-commerce-maven}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development password in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [commerce, web]
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-4200}:4200"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4200').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped
    networks: [commerce, web]
networks:
  commerce:
    driver: bridge
    internal: true
  web:
    driver: bridge
  db_access:
    driver: bridge
    internal: false

volumes:
  postgres_data:
